<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>Absensi Dinas X V3</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">

    <header>
      <b>DINAS X</b>
      <h1>Absensi Pegawai</h1>
      <p>Sistem Absensi V3</p>
    </header>

    <section
      id="message"
      class="message hidden"
    ></section>

    <section
      id="verifyView"
      class="card"
    >
      <h2>Verifikasi NIP</h2>

      <p>
        Masukkan NIP satu kali pada HP/browser ini.
      </p>

      <input
        id="nip"
        inputmode="numeric"
        placeholder="Masukkan NIP"
      >

      <button id="verifyBtn">
        VERIFIKASI NIP
      </button>
    </section>

    <section
      id="confirmView"
      class="card hidden"
    >
      <h2>Konfirmasi Data</h2>

      <div id="confirmData"></div>

      <p class="warning">
        Pastikan data benar. Setelah dikonfirmasi,
        perangkat ini terikat dengan NIP tersebut.
      </p>

      <button id="confirmBtn">
        KONFIRMASI & AKTIFKAN
      </button>

      <button
        id="backBtn"
        class="secondary"
      >
        KEMBALI
      </button>
    </section>

    <section
      id="attendanceView"
      class="hidden"
    >
      <div class="card">
        <h2 id="greeting"></h2>

        <div id="sessionData"></div>
      </div>

      <div class="card">
        <h3>Lokasi Absensi</h3>

        <p id="gpsStatus">
          Lokasi belum diperiksa.
        </p>

        <button
          id="gpsBtn"
          class="secondary"
        >
          CEK / AKTIFKAN GPS
        </button>
      </div>

      <button
        id="masukBtn"
        class="masuk"
      >
        ABSEN MASUK
      </button>

      <button
        id="keluarBtn"
        class="keluar"
      >
        ABSEN KELUAR
      </button>

      <button
        id="resetBtn"
        class="link"
      >
        Reset sesi browser
      </button>
    </section>

    <footer>
      Waktu dan validasi lokasi diperiksa server.
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
