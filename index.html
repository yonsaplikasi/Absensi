<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Absensi Pegawai - Dinas X</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <!-- ==================================================
                 JUDUL
            =================================================== -->

            <h1>ABSENSI PEGAWAI</h1>
            <p class="sub">DINAS X</p>


            <!-- ==================================================
                 FORM LOGIN
            =================================================== -->

            <div id="loginBox">

                <label for="nip">NIP</label>

                <input
                    id="nip"
                    type="text"
                    inputmode="numeric"
                    placeholder="Masukkan NIP"
                >


                <label for="pin">PIN</label>

                <input
                    id="pin"
                    type="password"
                    inputmode="numeric"
                    maxlength="8"
                    placeholder="Masukkan PIN"
                >


                <button
                    id="loginBtn"
                    class="primary"
                    type="button"
                >
                    MASUK
                </button>

            </div>


            <!-- ==================================================
                 DATA PEGAWAI
            =================================================== -->

            <div id="employeeBox" class="hidden">

                <div class="identity">

                    <div>
                        <small>Nama</small>
                        <strong id="nama"></strong>
                    </div>

                    <div>
                        <small>NIP</small>
                        <strong id="nipView"></strong>
                    </div>

                    <div>
                        <small>Bagian</small>
                        <strong id="bagian"></strong>
                    </div>

                </div>


                <!-- ==================================================
                     STATUS GPS
                =================================================== -->

                <div
                    id="gpsStatus"
                    class="status"
                >
                    Memeriksa GPS...
                </div>


                <!-- ==================================================
                     TOMBOL ABSENSI
                =================================================== -->

                <button
                    id="masukBtn"
                    class="primary"
                    type="button"
                >
                    ABSEN MASUK
                </button>

                <button
                    id="keluarBtn"
                    class="secondary"
                    type="button"
                >
                    ABSEN KELUAR
                </button>


                <!-- ==================================================
                     LOGOUT
                =================================================== -->

                <button
                    id="logoutBtn"
                    class="linkbtn"
                    type="button"
                >
                    Keluar dari akun
                </button>

            </div>


            <!-- ==================================================
                 PESAN / NOTIFIKASI
            =================================================== -->

            <div
                id="message"
                class="message"
            ></div>


            <!-- ==================================================
                 INFORMASI KEAMANAN
            =================================================== -->

            <div class="security">

                <b>Keamanan:</b>

                NIP + PIN memastikan identitas.
                Email Google dan Device ID hanya audit.

            </div>

        </section>

    </main>


    <!-- ========================================================
         JAVASCRIPT
    ========================================================= -->

    <script src="app.js"></script>

</body>

</html>
