<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Absensi Pegawai - Dinas X</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header>
    <h1>ABSENSI PEGAWAI</h1>
    <p>Dinas X</p>
  </header>

  <section class="card">
    <label>Nama Pegawai</label>
    <select id="employee">
      <option value="">Memuat data...</option>
    </select>

    <div id="identity" class="identity hidden">
      <div><b>NIP:</b> <span id="nip"></span></div>
      <div><b>Bagian:</b> <span id="bagian"></span></div>
    </div>

    <div class="gps-box" id="gpsBox">
      <b>📍 Status Lokasi</b>
      <p id="gpsStatus">Memeriksa kesiapan GPS...</p>
    </div>

    <div class="buttons">
      <button class="btn masuk" id="btnMasuk">🟢 ABSEN MASUK</button>
      <button class="btn keluar" id="btnKeluar">🔴 ABSEN KELUAR</button>
    </div>

    <div id="message" class="message"></div>
  </section>

  <section class="card">
    <h2>Informasi Keamanan</h2>
    <p class="small">
      Akun Google dan informasi perangkat digunakan sebagai data audit.
      Perubahan akun atau perangkat dapat ditandai untuk pemeriksaan admin.
    </p>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
